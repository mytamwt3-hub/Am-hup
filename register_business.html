<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل حساب تجاري - MetaHOP</title>
  <style>body{font-family:Tahoma,Arial;background:#f5f7fb;color:#111;padding:20px} .card{max-width:720px;margin:40px auto;padding:24px;border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.08)} label{display:block;margin-bottom:6px;font-weight:bold} input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccd;border-radius:4px} button{width:100%;padding:12px;border:none;border-radius:6px;background:#0066cc;color:#fff;font-weight:bold} .error{color:#c00;margin-bottom:12px;display:none}</style>
</head>
<body>
  <div class="card">
    <h2 style="text-align:center;margin-bottom:18px">إنشاء حساب تجاري</h2>
    <div id="error" class="error"></div>
    <form id="regForm">
      <label for="company_name">اسم الشركة</label>
      <input id="company_name" name="company_name" required>
      <label for="tax_number">الرقم الضريبي</label>
      <input id="tax_number" name="tax_number" required>
      <label for="commercial_registration">السجل التجاري</label>
      <input id="commercial_registration" name="commercial_registration" required>
      <label for="company_email">بريد الشركة الإلكتروني</label>
      <input id="company_email" name="company_email" type="email" required>
      <label for="manager_phone">رقم جوال مدير الشركة</label>
      <input id="manager_phone" name="manager_phone" required>
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" required>
      <label for="confirm">تأكيد كلمة المرور</label>
      <input id="confirm" name="confirm" type="password" required>
      <button type="submit">إنشاء الحساب التجاري</button>
    </form>
  </div>
<script>
const form = document.getElementById('regForm');
const err = document.getElementById('error');
form.addEventListener('submit', async (e)=>{
  e.preventDefault(); err.style.display='none';
  const company_name = document.getElementById('company_name').value.trim();
  const tax_number = document.getElementById('tax_number').value.trim();
  const commercial_registration = document.getElementById('commercial_registration').value.trim();
  const company_email = document.getElementById('company_email').value.trim();
  const manager_phone = document.getElementById('manager_phone').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if(password !== confirm){ err.textContent='كلمتا المرور غير متطابقتين'; err.style.display='block'; return; }
  try{
    const res = await fetch('/register/business', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company_name,tax_number,commercial_registration,company_email,manager_phone,password,confirm_password:confirm})});
    const j = await res.json();
    if(!res.ok){ err.textContent = j.message||'خطأ'; err.style.display='block'; return; }
    alert(j.message);
    window.location.href = '/login';
  }catch(ex){ err.textContent='تعذر الاتصال بالخادم'; err.style.display='block'; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول - MetaHOP</title>
  <style>
    body{font-family:Tahoma,Arial;background:#f5f7fb;color:#111;padding:20px}
    .card{max-width:420px;margin:40px auto;padding:24px;border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
    label{display:block;margin-bottom:6px;font-weight:bold}
    input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccd;padding-left:10px;border-radius:4px}
    button{width:100%;padding:12px;border:none;border-radius:6px;background:#0066cc;color:#fff;font-weight:bold}
    .links{margin-top:12px;text-align:center}
    .error{color:#c00;margin-bottom:12px;display:none}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="text-align:center;margin-bottom:18px">تسجيل الدخول</h2>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <label for="identifier">البريد الإلكتروني أو اسم المستخدم</label>
      <input id="identifier" name="identifier" type="text" placeholder="example@domain.com أو username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" placeholder="********" required>

      <button type="submit">تسجيل الدخول</button>
    </form>

    <div class="links">
      <a href="/register/personal">إنشاء حساب شخصي</a> | <a href="/register/business">إنشاء حساب تجاري</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('error');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      err.style.display='none';
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      try{
        const res = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({identifier, password})
        });
        const j = await res.json();
        if(!res.ok){
          err.textContent = j.message || 'خطأ في عملية الدخول';
          err.style.display='block';
          return;
        }
        // redirect based on backend response
        if(j.redirect){ window.location.href = j.redirect; }
        else { window.location.href = '/'; }
      }catch(ex){
        err.textContent = 'تعذر الإتصال بالخادم'; err.style.display='block';
      }
    });
  </script>
</body>
</html>
